<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Browser Farm - 隔离浏览器中继控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-secondary: #121824;
            --bg-card: rgba(22, 30, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* 顶部导航 */
        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 13, 20, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 统计看板 */
        .stats-grid {
            max-width: 1400px;
            margin: 28px auto 0;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 20px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        /* 过滤与搜索工具栏 */
        .toolbar {
            max-width: 1400px;
            margin: 24px auto 0;
            padding: 0 24px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .groups-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-pill {
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .group-pill:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .group-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            gap: 8px;
            min-width: 260px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
        }

        /* 主体列表 */
        main {
            max-width: 1400px;
            margin: 20px auto 40px;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 22px;
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .profile-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-id-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-flag {
            font-size: 24px;
            line-height: 1;
        }

        .card-id {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .card-group-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-badge.running {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* 纯净度与网络体检看板 */
        .health-box {
            background: rgba(10, 13, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .health-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .health-row .label {
            color: var(--text-muted);
        }

        .health-row .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .isp-badge {
            color: #38bdf8;
            font-weight: 600;
        }

        .latency-badge {
            color: #a78bfa;
            font-weight: 600;
        }

        /* 按钮与操作条 */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 6px;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            flex: 1;
            box-shadow: 0 2px 8px var(--success-glow);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .btn-danger-ghost:hover {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.08);
        }

        /* 模态弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            width: 100%;
            max-width: 520px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-control {
            background: rgba(10, 13, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .probe-preview {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            display: none;
        }

        /* 剪贴板工具模态窗 */
        .clipboard-box textarea {
            width: 100%;
            height: 120px;
            background: rgba(10, 13, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <div class="nav-container">
            <div class="brand">
                <div class="brand-logo">🌐</div>
                <span class="brand-title">Isolated Browser Farm</span>
                <span class="brand-badge">Enterprise v2.0</span>
            </div>
            <div class="nav-actions">
                <button class="btn btn-secondary" onclick="fetchAllProfiles()">🔄 刷新列表</button>
                <button class="btn btn-primary" onclick="openAddModal()">＋ 新增 Profile</button>
            </div>
        </div>
    </header>

    <!-- 统计看板 -->
    <section class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">运行中 Profile 数量</span>
            <span class="stat-value" id="stat-active">0 / 0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">真实静态住宅 IP 占比</span>
            <span class="stat-value" id="stat-residential" style="color: #34d399;">-- %</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">业务隔离分组</span>
            <span class="stat-value" id="stat-groups">1 个</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">底层 WebRTC 盾</span>
            <span class="stat-value" style="color: #38bdf8;">100% 阻断</span>
        </div>
    </section>

    <!-- 过滤与搜索工具栏 -->
    <section class="toolbar">
        <div class="groups-bar" id="groups-container">
            <div class="group-pill active" onclick="filterByGroup('全部')">全部</div>
        </div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="搜索账号 ID、IP、城市或分组..." oninput="handleSearch()">
        </div>
    </section>

    <!-- Profile 卡片容器 -->
    <main>
        <div class="profiles-grid" id="profiles-container">
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">
                正在加载云端隔离浏览器集群...
            </div>
        </div>
    </main>

    <!-- 模态弹窗：新增 Profile -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">创建独立隔离浏览器环境</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            
            <div class="form-group">
                <label>账号标识 ID (用于容器名与存储路径)</label>
                <input type="text" id="new-id" class="form-control" placeholder="如 acc2, tiktok-01, google-main">
            </div>

            <div class="form-group">
                <label>业务分组 (Tag / Group)</label>
                <input type="text" id="new-group" class="form-control" placeholder="如 Google 矩阵, 跨境电商, 社媒营销" value="默认分组">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>静态住宅代理配置</label>
                    <a href="javascript:void(0)" onclick="probeNewProxy()" style="font-size: 12px; color: #818cf8; text-decoration: none;">⚡ 探测属地与时区</a>
                </div>
                <input type="text" id="new-proxy" class="form-control" placeholder="IP:PORT:USER:PASS 或 direct (直连)">
                <div id="probe-result" class="probe-preview"></div>
            </div>

            <div class="form-group">
                <label>系统时区 (已自动由 IP 智能对齐)</label>
                <input type="text" id="new-tz" class="form-control" value="America/New_York">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="closeAddModal()" style="flex: 1;">取消</button>
                <button class="btn btn-primary" id="btn-submit-add" onclick="submitAddProfile()" style="flex: 1;">立即创建并部署</button>
            </div>
        </div>
    </div>

    <!-- 模态弹窗：云剪贴板互通 -->
    <div class="modal-overlay" id="clipboard-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">📋 云剪贴板桥接 (<span id="clip-acc-id"></span>)</h3>
                <button class="modal-close" onclick="closeClipboardModal()">&times;</button>
            </div>
            <div class="clipboard-box">
                <textarea id="clip-text" placeholder="在此粘贴长文本、密码或 Token，点击「发送到云端」后即可在远程浏览器中按 Ctrl+V 粘贴..."></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="fetchFromCloud()" style="flex: 1;">⬇️ 从云端读取</button>
                <button class="btn btn-primary" onclick="sendToCloud()" style="flex: 1;">⬆️ 发送到云端</button>
            </div>
        </div>
    </div>

    <script>
        let allProfiles = [];
        let currentGroup = "全部";
        let activeClipId = "";

        async function fetchAllProfiles() {
            try {
                const res = await fetch('/api/profiles');
                const data = await res.json();
                if (data.success) {
                    allProfiles = data.profiles;
                    renderGroups(data.groups);
                    renderProfiles();
                    updateStats();
                }
            } catch (err) {
                console.error("加载失败:", err);
            }
        }

        function renderGroups(groups) {
            const container = document.getElementById('groups-container');
            container.innerHTML = groups.map(g => `
                <div class="group-pill ${g === currentGroup ? 'active' : ''}" onclick="filterByGroup('${g}')">${g}</div>
            `).join('');
        }

        function filterByGroup(group) {
            currentGroup = group;
            document.querySelectorAll('.group-pill').forEach(el => {
                el.classList.toggle('active', el.textContent.trim() === group);
            });
            renderProfiles();
        }

        function handleSearch() {
            renderProfiles();
        }

        function updateStats() {
            const total = allProfiles.length;
            const running = allProfiles.filter(p => p.state === 'running').length;
            document.getElementById('stat-active').textContent = `${running} / ${total}`;

            let resCount = 0;
            allProfiles.forEach(p => {
                if (p.last_check && p.last_check.type && p.last_check.type.includes("Residential")) {
                    resCount++;
                } else if (p.proxy && p.proxy !== "直连 (无二级代理)") {
                    resCount++;
                }
            });
            const ratio = total > 0 ? Math.round((resCount / total) * 100) : 100;
            document.getElementById('stat-residential').textContent = `${ratio}%`;

            const uniqueGroups = new Set(allProfiles.map(p => p.group || "默认分组"));
            document.getElementById('stat-groups').textContent = `${uniqueGroups.size} 个`;
        }

        function renderProfiles() {
            const container = document.getElementById('profiles-container');
            const search = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = allProfiles.filter(p => {
                const matchGroup = (currentGroup === "全部" || p.group === currentGroup);
                const matchSearch = !search || 
                    p.id.toLowerCase().includes(search) || 
                    p.proxy.toLowerCase().includes(search) ||
                    (p.last_check && (p.last_check.city.toLowerCase().includes(search) || p.last_check.isp.toLowerCase().includes(search)));
                return matchGroup && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">暂无匹配的浏览器环境</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const isRunning = p.state === 'running';
                const flag = p.last_check ? p.last_check.flag : "🇺🇸";
                const city = p.last_check ? `${p.last_check.city}, ${p.last_check.region}` : p.timezone.split("/")[1] || "New York";
                const latency = p.last_check ? `${p.last_check.latency_ms} ms` : "--";
                const isp = p.last_check ? p.last_check.isp : "Comcast / 静态住宅";
                const netType = p.last_check ? p.last_check.type : "Residential ISP (住宅宽带)";

                return `
                <div class="profile-card">
                    <div class="card-header">
                        <div class="card-id-wrap">
                            <span class="card-flag">${flag}</span>
                            <div>
                                <div class="card-id">${p.id}</div>
                                <span class="card-group-tag">${p.group || '默认分组'}</span>
                            </div>
                        </div>
                        <span class="status-badge ${isRunning ? 'running' : 'stopped'}">
                            <span class="status-dot"></span>
                            ${isRunning ? '运行中' : '已停止'}
                        </span>
                    </div>

                    <!-- 纯净度体检看板 -->
                    <div class="health-box">
                        <div class="health-row">
                            <span class="label">属地 / 城市</span>
                            <span class="value">${city}</span>
                        </div>
                        <div class="health-row">
                            <span class="label">运营商 (ISP)</span>
                            <span class="value isp-badge">${isp}</span>
                        </div>
                        <div class="health-row">
                            <span class="label">延迟 / 属性</span>
                            <span class="value latency-badge">⚡ ${latency} · ${netType}</span>
                        </div>
                    </div>

                    <!-- 操作工具栏 -->
                    <div class="card-actions">
                        ${isRunning && p.external_url ? `
                            <a href="${p.external_url}" target="_blank" class="btn btn-primary">🚀 打开</a>
                        ` : `
                            <button class="btn btn-secondary" onclick="controlProfile('${p.id}', 'start')">▶️ 启动</button>
                        `}
                        <button class="btn btn-secondary" title="一键体检测速" onclick="probeProfile('${p.id}')">⚡ 体检</button>
                        <button class="btn btn-secondary" title="云剪贴板" onclick="openClipboardModal('${p.id}')">📋</button>
                        <button class="btn btn-secondary" title="备份下载" onclick="backupProfile('${p.id}')">📦</button>
                        <button class="btn btn-secondary btn-danger-ghost" title="删除环境" onclick="deleteProfile('${p.id}')">🗑️</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 一键测速体检
        async function probeProfile(accId) {
            const btn = event.currentTarget;
            btn.textContent = "⏳...";
            try {
                const res = await fetch('/api/proxy/probe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: accId})
                });
                const data = await res.json();
                if (data.success) {
                    await fetchAllProfiles();
                } else {
                    alert("体检失败: " + data.error);
                }
            } catch (e) {
                alert("网络超时");
            } finally {
                btn.textContent = "⚡ 体检";
            }
        }

        // 新增弹窗中的代理智能探测
        async function probeNewProxy() {
            const proxy = document.getElementById('new-proxy').value.trim();
            const resBox = document.getElementById('probe-result');
            if (!proxy) {
                alert("请先输入代理字符串");
                return;
            }
            resBox.style.display = "block";
            resBox.innerHTML = "⏳ 正在通过该代理向 ipinfo.io 握手体检...";

            try {
                const res = await fetch('/api/proxy/probe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({proxy: proxy})
                });
                const data = await res.json();
                if (data.success) {
                    resBox.innerHTML = `
                        <b>${data.flag} ${data.city} (${data.country})</b><br>
                        🏢 运营商: ${data.isp}<br>
                        ⚡ 延迟: ${data.latency_ms}ms · ${data.type}
                    `;
                    if (data.timezone) {
                        document.getElementById('new-tz').value = data.timezone;
                    }
                } else {
                    resBox.innerHTML = `❌ 探测失败: ${data.error}`;
                }
            } catch (e) {
                resBox.innerHTML = "❌ 请求超时";
            }
        }

        // 提交新增
        async function submitAddProfile() {
            const id = document.getElementById('new-id').value.trim();
            const group = document.getElementById('new-group').value.trim();
            const proxy = document.getElementById('new-proxy').value.trim();
            const tz = document.getElementById('new-tz').value.trim();
            const btn = document.getElementById('btn-submit-add');

            if (!id) {
                alert("请输入账号 ID");
                return;
            }

            btn.disabled = true;
            btn.textContent = "正在创建并配置环境...";

            try {
                const res = await fetch('/api/profiles/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, group, proxy, timezone: tz})
                });
                const data = await res.json();
                if (data.success) {
                    closeAddModal();
                    await fetchAllProfiles();
                } else {
                    alert("创建失败: " + data.error);
                }
            } catch (e) {
                alert("网络超时");
            } finally {
                btn.disabled = false;
                btn.textContent = "立即创建并部署";
            }
        }

        // 基础控制
        async function controlProfile(id, action) {
            const res = await fetch('/api/profiles/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id, action})
            });
            const data = await res.json();
            if (data.success) {
                fetchAllProfiles();
            } else {
                alert("操作失败: " + data.error);
            }
        }

        async function deleteProfile(id) {
            if (!confirm(`确定要彻底删除账号 [${id}] 及其全部持久化 Cookie 数据吗？此操作不可逆！`)) return;
            controlProfile(id, 'delete');
        }

        function backupProfile(id) {
            window.open(`/api/profiles/backup?id=${id}`, '_blank');
        }

        // 剪贴板模态窗
        function openClipboardModal(id) {
            activeClipId = id;
            document.getElementById('clip-acc-id').textContent = id;
            document.getElementById('clip-text').value = '';
            document.getElementById('clipboard-modal').classList.add('active');
        }

        function closeClipboardModal() {
            document.getElementById('clipboard-modal').classList.remove('active');
        }

        async function sendToCloud() {
            const text = document.getElementById('clip-text').value;
            if (!text) {
                alert("请先输入要发送的文本");
                return;
            }
            const res = await fetch('/api/clipboard/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: activeClipId, text})
            });
            const data = await res.json();
            if (data.success) {
                alert("✅ 已成功注入到云端剪贴板！请直接在远程浏览器窗口内按 Ctrl+V 粘贴。");
            } else {
                alert("同步失败");
            }
        }

        async function fetchFromCloud() {
            const res = await fetch(`/api/clipboard/get?id=${activeClipId}`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('clip-text').value = data.text || '';
                if (!data.text) {
                    alert("云端剪贴板当前为空");
                }
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        // 初始化
        fetchAllProfiles();
        setInterval(fetchAllProfiles, 15000);
    </script>
</body>
</html>
